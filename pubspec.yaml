name: dart_acdc
description: A zero-config, opinionated HTTP client for Flutter mobile apps with built-in authentication, caching, logging, and error handling. Integrates seamlessly with OpenAPI-generated code.
version: 0.1.0
repository: https://github.com/yourusername/dart-acdc
homepage: https://github.com/yourusername/dart-acdc
issue_tracker: https://github.com/yourusername/dart-acdc/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  pretty_dio_logger: ^1.3.1

dev_dependencies:
  build_runner: ^2.4.8
  built_collection: ^5.1.1
  built_value: ^8.4.0
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mockito: ^5.4.4
  openapi:
    path: example/lib/api_client
  path: ^1.9.1
  shelf: ^1.4.0
  test: ^1.24.9

flutter:
  # No assets or plugins in this library
