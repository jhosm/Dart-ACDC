name: dart_acdc
description: A zero-config, opinionated HTTP client for Flutter mobile apps with built-in authentication, caching, logging, and error handling. Integrates seamlessly with OpenAPI-generated code.
version: 0.2.0
repository: https://github.com/jhosm/Dart-ACDC
homepage: https://github.com/jhosm/Dart-ACDC
issue_tracker: https://github.com/jhosm/Dart-ACDC/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  dio: ^5.4.0
  dio_cache_interceptor: ^4.0.5
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  http_cache_file_store: ^2.0.1
  jwt_decoder: ^2.0.1
  meta: ^1.17.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.3.1

dev_dependencies:
  build_runner: ^2.10.5
  built_collection: ^5.1.1
  built_value: ^8.12.3
  connectivity_plus_platform_interface: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mockito: ^5.6.3
  shelf: ^1.4.0
  test: ^1.26.3
